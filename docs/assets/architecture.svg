<svg viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="480" fill="url(#bg)"/>

  <!-- ── SECTION 1: INPUT ── -->
  <rect x="20" y="70" width="210" height="180" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="97" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="2">INPUT</text>
  <line x1="40" y1="106" x2="210" y2="106" stroke="#475569" stroke-width="0.8"/>
  <text x="125" y="130" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">pandas DataFrame</text>
  <text x="125" y="150" text-anchor="middle" fill="#94a3b8" font-size="10">features · target</text>
  <text x="125" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">optional timestamp col</text>
  <line x1="45" y1="178" x2="205" y2="178" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <text x="125" y="196" text-anchor="middle" fill="#64748b" font-size="10">train_df · test_df (optional)</text>
  <text x="125" y="212" text-anchor="middle" fill="#64748b" font-size="9">target_col · split_col</text>
  <text x="125" y="227" text-anchor="middle" fill="#64748b" font-size="9">outcome_time_col · thresholds</text>

  <!-- Arrow INPUT → ENGINE -->
  <line x1="230" y1="160" x2="296" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── SECTION 2: AUDIT ENGINE (RED THEME) ── -->
  <rect x="300" y="30" width="516" height="400" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="558" y="62" text-anchor="middle" fill="#f87171" font-size="16" font-weight="700">FeatureLeakageLens Engine</text>
  <line x1="320" y1="72" x2="796" y2="72" stroke="#ef4444" stroke-width="0.8" opacity="0.4"/>
  <text x="558" y="90" text-anchor="middle" fill="#9f6060" font-size="10">6 deterministic checks · no model training required</text>

  <!-- 6 Check boxes (2 cols x 3 rows) -->
  <rect x="320" y="104" width="236" height="36" rx="4" fill="#0f172a"/>
  <text x="438" y="127" text-anchor="middle" fill="#94a3b8" font-size="12">target_leakage</text>

  <rect x="566" y="104" width="236" height="36" rx="4" fill="#0f172a"/>
  <text x="684" y="127" text-anchor="middle" fill="#94a3b8" font-size="12">temporal_leakage</text>

  <rect x="320" y="150" width="236" height="36" rx="4" fill="#0f172a"/>
  <text x="438" y="173" text-anchor="middle" fill="#94a3b8" font-size="12">train_test_leakage</text>

  <rect x="566" y="150" width="236" height="36" rx="4" fill="#0f172a"/>
  <text x="684" y="173" text-anchor="middle" fill="#94a3b8" font-size="12">id_leakage</text>

  <rect x="320" y="196" width="236" height="36" rx="4" fill="#0f172a"/>
  <text x="438" y="219" text-anchor="middle" fill="#94a3b8" font-size="12">derived_leakage</text>

  <rect x="566" y="196" width="236" height="36" rx="4" fill="#0f172a"/>
  <text x="684" y="219" text-anchor="middle" fill="#94a3b8" font-size="12">cardinality_check</text>

  <!-- Threshold note -->
  <rect x="340" y="250" width="430" height="28" rx="6" fill="#450a0a" opacity="0.9"/>
  <text x="555" y="269" text-anchor="middle" fill="#f87171" font-size="10">Correlation threshold: 0.95 · Name heuristic: keyword scan · No model fitting</text>

  <!-- Status pills -->
  <rect x="340" y="296" width="72" height="24" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="376" y="313" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="700">PASS</text>
  <rect x="424" y="296" width="72" height="24" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="460" y="313" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">WARN</text>
  <rect x="508" y="296" width="72" height="24" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="544" y="313" text-anchor="middle" fill="#f87171" font-size="10" font-weight="700">FAIL</text>
  <text x="698" y="313" text-anchor="middle" fill="#9f6060" font-size="10">per check · feature-level evidence</text>

  <!-- Caution box inside engine -->
  <rect x="340" y="334" width="430" height="36" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" opacity="0.8"/>
  <text x="555" y="352" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">STOP — do not train if FAIL status on target_leakage</text>
  <text x="555" y="366" text-anchor="middle" fill="#9f6060" font-size="9">misleading CV scores are not model quality — they are data contamination</text>

  <!-- API label -->
  <text x="558" y="410" text-anchor="middle" fill="#ef4444" font-size="10" opacity="0.4">audit(train_df, test_df, target_col) → LeakageReport · src/featureleakagelens/checks.py</text>

  <!-- Arrows ENGINE → outputs -->
  <line x1="816" y1="120" x2="876" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="816" y1="210" x2="876" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="816" y1="310" x2="876" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── SECTION 3: OUTPUT ── -->
  <rect x="878" y="88" width="202" height="72" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="979" y="114" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">LeakageReport</text>
  <text x="979" y="133" text-anchor="middle" fill="#fca5a5" font-size="10">PASS · WARN · FAIL per check</text>
  <text x="979" y="148" text-anchor="middle" fill="#94a3b8" font-size="10">feature-level evidence</text>

  <rect x="878" y="180" width="202" height="72" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="979" y="206" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">JSON · MD · HTML</text>
  <text x="979" y="225" text-anchor="middle" fill="#94a3b8" font-size="10">correlation scores</text>
  <text x="979" y="240" text-anchor="middle" fill="#94a3b8" font-size="10">column names · row counts</text>

  <rect x="878" y="282" width="202" height="72" rx="8" fill="#374151" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="979" y="303" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">CLI + Python API</text>
  <text x="979" y="322" text-anchor="middle" fill="#94a3b8" font-size="10">python -m featureleakagelens</text>
  <text x="979" y="338" text-anchor="middle" fill="#94a3b8" font-size="10">audit(train_df, test_df, target)</text>

  <!-- ── BOTTOM STATS BAR ── -->
  <rect x="20" y="445" width="1060" height="28" rx="8" fill="#0f172a" filter="url(#shadow)"/>
  <line x1="20" y1="445" x2="1080" y2="445" stroke="#ef4444" stroke-width="2" opacity="0.4"/>

  <rect x="34" y="452" width="152" height="16" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="110" y="464" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="700">Checks: 6 deterministic</text>

  <rect x="200" y="452" width="166" height="16" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="283" y="464" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="700">No Model Training: zero-cost</text>

  <rect x="382" y="452" width="184" height="16" rx="8" fill="#422006" stroke="#eab308" stroke-width="1"/>
  <text x="474" y="464" text-anchor="middle" fill="#fde047" font-size="10" font-weight="700">Correlation Threshold: 0.95</text>

  <rect x="582" y="452" width="118" height="16" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="641" y="464" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="700">PRD Status: PASS</text>

  <text x="900" y="463" text-anchor="middle" fill="#475569" font-size="9">github.com/SidharthKriplani/featureleakagelens</text>
</svg>
