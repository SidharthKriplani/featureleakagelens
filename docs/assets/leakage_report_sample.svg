<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="url(#bg)"/>

  <!-- ── HEADER BAR ── -->
  <rect x="0" y="0" width="1000" height="86" fill="#7f1d1d"/>
  <line x1="0" y1="86" x2="1000" y2="86" stroke="#ef4444" stroke-width="2" opacity="0.8"/>

  <!-- FAIL badge -->
  <rect x="18" y="16" width="70" height="36" rx="6" fill="#ef4444"/>
  <text x="53" y="41" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">FAIL</text>
  <text x="100" y="34" text-anchor="start" fill="#fca5a5" font-size="13" font-weight="600">Critical leakage detected</text>

  <!-- Center title -->
  <text x="500" y="32" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="700">FeatureLeakageAudit — credit_default_dataset.csv</text>
  <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">50,000 rows · 23 features · Audit-ID: FLL-2024-0891 · 1.1s</text>
  <text x="500" y="70" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">DO NOT TRAIN — target leakage confirmed</text>

  <!-- Right badges -->
  <rect x="834" y="18" width="106" height="22" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="887" y="34" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">6/6 checks run</text>
  <rect x="834" y="46" width="148" height="22" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="908" y="62" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">no model trained</text>

  <!-- ── CARD 1: TARGET LEAKAGE ── -->
  <rect x="12" y="100" width="310" height="260" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <rect x="12" y="100" width="310" height="36" rx="8" fill="#450a0a"/>
  <rect x="12" y="120" width="310" height="16" fill="#450a0a"/>
  <text x="28" y="124" text-anchor="start" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1.5">TARGET LEAKAGE</text>
  <rect x="244" y="107" width="70" height="22" rx="4" fill="#ef4444"/>
  <text x="279" y="123" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">FAIL</text>

  <text x="28" y="158" text-anchor="start" fill="#f87171" font-size="11" font-weight="600">"account_status"</text>
  <text x="28" y="175" text-anchor="start" fill="#94a3b8" font-size="10">correlation 0.97 with target</text>
  <text x="28" y="196" text-anchor="start" fill="#f87171" font-size="11" font-weight="600">"payment_plan_flag"</text>
  <text x="28" y="213" text-anchor="start" fill="#94a3b8" font-size="10">correlation 0.94 with target</text>

  <line x1="28" y1="228" x2="306" y2="228" stroke="#475569" stroke-width="0.5"/>
  <text x="28" y="246" text-anchor="start" fill="#64748b" font-size="10">Feature generated AFTER loan default event</text>
  <text x="28" y="263" text-anchor="start" fill="#64748b" font-size="10">Near-perfect CV scores fail in production</text>

  <rect x="16" y="330" width="302" height="26" rx="4" fill="#450a0a" opacity="0.9"/>
  <text x="167" y="340" text-anchor="middle" fill="#f87171" font-size="10" font-weight="700">Action: REMOVE before training</text>
  <text x="167" y="351" text-anchor="middle" fill="#f87171" font-size="9">not a predictive signal</text>

  <!-- ── CARD 2: TEMPORAL LEAKAGE ── -->
  <rect x="338" y="100" width="310" height="260" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="338" y="100" width="310" height="36" rx="8" fill="#451a03"/>
  <rect x="338" y="120" width="310" height="16" fill="#451a03"/>
  <text x="354" y="124" text-anchor="start" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1.5">TEMPORAL LEAKAGE</text>
  <rect x="572" y="107" width="64" height="22" rx="4" fill="#f59e0b"/>
  <text x="604" y="123" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">WARN</text>

  <text x="354" y="158" text-anchor="start" fill="#fbbf24" font-size="11" font-weight="600">"credit_score_updated_at"</text>
  <text x="354" y="176" text-anchor="start" fill="#94a3b8" font-size="10">future timestamps in 847 rows</text>

  <line x1="354" y1="192" x2="632" y2="192" stroke="#475569" stroke-width="0.5"/>
  <text x="354" y="212" text-anchor="start" fill="#94a3b8" font-size="10">Train set contains data from 2024-03</text>
  <text x="354" y="228" text-anchor="start" fill="#94a3b8" font-size="10">that post-dates target event</text>
  <text x="354" y="248" text-anchor="start" fill="#64748b" font-size="10">3.4% of training rows affected</text>

  <rect x="342" y="330" width="302" height="26" rx="4" fill="#451a03" opacity="0.9"/>
  <text x="493" y="340" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">Apply temporal cutoff filter</text>
  <text x="493" y="351" text-anchor="middle" fill="#fbbf24" font-size="9">exclude post-event rows from training</text>

  <!-- ── CARD 3: TRAIN-TEST LEAKAGE ── -->
  <rect x="664" y="100" width="324" height="260" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="664" y="100" width="324" height="36" rx="8" fill="#14532d"/>
  <rect x="664" y="120" width="324" height="16" fill="#14532d"/>
  <text x="680" y="124" text-anchor="start" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1.5">TRAIN-TEST LEAKAGE</text>
  <rect x="904" y="107" width="72" height="22" rx="4" fill="#22c55e"/>
  <text x="940" y="123" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">PASS</text>

  <text x="680" y="158" text-anchor="start" fill="#4ade80" font-size="11" font-weight="600">0 overlapping row IDs</text>
  <text x="680" y="176" text-anchor="start" fill="#94a3b8" font-size="10">between train and test</text>

  <line x1="680" y1="192" x2="972" y2="192" stroke="#475569" stroke-width="0.5"/>
  <text x="680" y="212" text-anchor="start" fill="#94a3b8" font-size="10">No customer appears in both splits</text>
  <text x="680" y="230" text-anchor="start" fill="#94a3b8" font-size="10">Test set is clean temporal holdout</text>

  <rect x="680" y="256" width="296" height="22" rx="4" fill="#14532d" opacity="0.5"/>
  <text x="828" y="272" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">Split integrity: VERIFIED</text>

  <rect x="668" y="330" width="316" height="26" rx="4" fill="#14532d" opacity="0.9"/>
  <text x="826" y="348" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="700">No action required on this check</text>

  <!-- ── SUMMARY BOX ── -->
  <rect x="12" y="370" width="976" height="88" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="12" y="370" width="5" height="88" rx="2" fill="#ef4444"/>

  <text x="30" y="394" text-anchor="start" fill="#f87171" font-size="13" font-weight="700">STOP — do not train this model.</text>
  <text x="30" y="416" text-anchor="start" fill="#94a3b8" font-size="11">Target leakage in 'account_status' will produce misleading ROC-AUC near 1.0 in CV.</text>
  <text x="30" y="434" text-anchor="start" fill="#fca5a5" font-size="11">This is not model quality — it is data contamination. Remove leaking features, then re-audit.</text>

  <!-- ── FOOTER ── -->
  <rect x="0" y="468" width="1000" height="32" fill="#0f172a"/>
  <line x1="0" y1="468" x2="1000" y2="468" stroke="#475569" stroke-width="0.8"/>
  <text x="500" y="490" text-anchor="middle" fill="#475569" font-size="10">FEATURELEAKAGELENS · Pre-training feature leakage auditor · No model training required · github.com/SidharthKriplani/featureleakagelens</text>
</svg>
